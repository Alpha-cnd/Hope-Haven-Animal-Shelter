<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View rescued animals and gallery photos from Hope Haven Animal Shelter.">
    <title>Gallery | Hope Haven Animal Shelter</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
    <header>
        <nav>
            <img src="IMAGES/logo.jpg" style="width: 75px; height: 85px;" alt="Logo">
            <a href="index.html">Homepage</a> |
            <a href="about.html">About Us</a> |
            <a href="services.html">Services</a> |
            <a href="gallery.html">Gallery</a> |
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main style="background-color: #36454F; color: #FFF8E7; padding: 20px;">
        <h1>Shelter Gallery</h1>
        <p>Click on any image to view it in full screen.</p>

        <!-- Gallery Grid -->
        <div class="gallery-grid" style="display: flex; flex-wrap: wrap; gap: 15px;">
          
<img src="IMAGES/2.jpg" style="width: 500px; height: 550px;">
<img src="IMAGES/3.jpg"  style="width: 500px; height: 550px;">>
<img src="IMAGES/4.jpg"  style="width: 500px; height: 550px;">>
<img src="IMAGES/5.jpg"  style="width: 500px; height: 550px;">>
<img src="IMAGES/images (1).jpg"  style="width: 500px; height: 550px;">>
<img src="IMAGES/images.jpg"  style="width: 500px; height: 550px;">>
<img src="IMAGES/images (7).jpg" style="width: 500px; height: 550px;">
<img src="IMAGES/images (5).jpg" style="width: 500px; height: 550px;">
<img src="IMAGES/images (13).jpg" style="width: 500px; height: 550px;">
<img src="IMAGES/images (12).jpg" style="width: 500px; height: 550px;">
<video src="IMAGES/Download (14).mp4" controls style="width: 500px; height: 550px;">
<video src="IMAGES/Download (18).mp4" controls style="width: 500px; height: 550px;"> 
    
        </div>

        <!-- Lightbox Modal Container -->
        <div id="lightboxModal" class="lightbox-modal">
            <span class="lightbox-close">&times;</span>
            <img class="lightbox-content" id="lightboxImg" alt="Enlarged photo view">
            <div id="lightboxCaption"></div>
        </div>
    </main>

    <footer>
        &copy; ST10513428 #Home_Haven_Animal_Shelter
